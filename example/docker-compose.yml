services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_Password123!"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  example:
    build:
      context: ..
      dockerfile: example/Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      ENV: "dev"
      GIT_SHA: "docker"
      MSSQL_HOST: "mssql"
      MSSQL_PORT: "1433"
      MSSQL_USER: "sa"
      MSSQL_PASSWORD: "Your_Password123!"
      MSSQL_DATABASE: "master"
      MSSQL_CONNECT_TIMEOUT: "5s"
      MSSQL_CONNECT_RETRY_ATTEMPTS: "15"
      MSSQL_CONNECT_RETRY_BASE_DELAY: "1s"
      MSSQL_CONNECT_RETRY_MAX_DELAY: "5s"
    ports:
      - "18080:8080"
      - "19090:9090"
